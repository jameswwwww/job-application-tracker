name: Job Tracker Extension CI

on:
  push:
    paths:
      - "job-tracker-ext/**"
      - ".github/workflows/job-tracker-ext.yml"

  pull_request:
    paths:
      - "job-tracker-ext/**"
      - ".github/workflows/job-tracker-ext.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: job-tracker-ext

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run compile

      - name: Run tests
        run: bun run test

      - name: Build extension
        run: bun run build
